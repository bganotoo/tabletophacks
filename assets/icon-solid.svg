<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"
     fill="none" role="img" aria-label="Tabletop Hacks d20">
  <rect width="512" height="512" rx="96" fill="#0d0d1a"/>
  <g transform="translate(56 56) scale(6.25)">
    <!-- Outer pentagonal silhouette -->
    <path d="M32 4 L58 20 L50 56 L14 56 L6 20 Z"
          stroke="#f59e0b" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Horizontal divider across the two middle vertices -->
    <line x1="6" y1="20" x2="58" y2="20" stroke="#f59e0b" stroke-width="2.5"/>
    <!-- Internal lines radiating from center point (32,40) -->
    <line x1="6"  y1="20" x2="32" y2="40" stroke="#f59e0b" stroke-width="2"/>
    <line x1="58" y1="20" x2="32" y2="40" stroke="#f59e0b" stroke-width="2"/>
    <line x1="32" y1="4"  x2="32" y2="40" stroke="#f59e0b" stroke-width="2"/>
    <line x1="32" y1="40" x2="14" y2="56" stroke="#f59e0b" stroke-width="2"/>
    <line x1="32" y1="40" x2="50" y2="56" stroke="#f59e0b" stroke-width="2"/>
  </g>
</svg>
